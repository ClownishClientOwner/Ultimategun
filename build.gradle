plugins {
    // 1. Changed to the explicit obfuscated remap ID and pinned a stable version 
    // compatible with Gradle 8.14 instead of using unstable SNAPSHOTs.
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

version = '1.0.0'
group = 'dev.example'

base {
    archivesName = 'ultimate-gun'
}

repositories {
    mavenCentral()
    // 2. Added the Fabric repository so your toolchain can find Loom and its dependencies
    maven { url = 'https://maven.fabricmc.net/' } 
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.4:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.0+1.21.11'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}
